<!-- 출처: AI 프로젝트 매니저 최종보고서 부록 4, 방 이름과 닉네임 입력 화면 -->
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Masite</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.2/css/bulma.min.css">
</head>
<body>
  <section class="section">
    <div class="container">
          <div class="columns is-multiline">
            <div class="column is-6 is-offset-3 mb-6">
               <section class="hero is-primary" style="background-color: #5072AE;">
                 <div class="hero-body">
                     <p class="title">
                        AI 회의실
                     </p>
                     <p class="subtitle">
                        AI 프로젝트 매니저 : 인간과 상호 작용하는 대화형 에이전트


                     </p>
                 </div>
               </section>
            </div>
            <div class="column is-4 is-offset-4">
               <div class="field">
                 <label>Room name</label>


                 <div class="control">
                         <input class="input" type="text" placeholder="Room name" id="room-
name-input">
                 </div>
               </div>


               <div class="field">
                 <label>Username</label>


                 <div class="control">
                      <input class="input" type="text" placeholder="Username" id="username-
input">
                 </div>
               </div>
              <div class="field">
                  <div class="control">
                    <a class="button is-info" id="room-name-submit">Submit</a>
                  </div>
              </div>
           </div>
         </div>
    </div>
  </section>


  <script>
    document.querySelector('#room-name-input').focus();


    document.querySelector('#room-name-submit').onclick = function (e) {
         var roomName = document.querySelector('#room-name-input').value;
         var userName = document.querySelector('#username-input').value;
         window.location.replace(roomName + '/?username=' + userName);
    };
  </script>
</body>


</html>
